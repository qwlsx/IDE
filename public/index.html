<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="task-app">
    <h1>Task List</h1>
    <p class="subtitle">Keep track of your study tasks.</p>

    <form class="task-form">
      <input
        type="text"
        placeholder="Enter a new task"
        aria-label="New task"
      >
      <button type="submit">Add task</button>
    </form>

    <ul class="task-list">
      <li class="task-item">
        <span>Finish the programming exercise</span>
        <div class="task-actions">
          <button class="complete-button" type="button">Complete</button>
          <button class="delete-button" type="button">Delete</button>
        </div>
      </li>
      <li class="task-item completed">
        <span>Read the course material</span>
        <div class="task-actions">
          <button class="complete-button" type="button">Undo</button>
          <button class="delete-button" type="button">Delete</button>
        </div>
      </li>
    </ul>
  </main>
</body>
</html>
